name: Deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned frontend tools
        run: npm ci
      - name: Restore responsive WebP cache
        id: responsive-webp-cache
        uses: actions/cache@v5
        with:
          path: _site/assets/img/**/*.webp
          key: responsive-webp-v1-${{ runner.os }}-${{ hashFiles('assets/img/**', '_config.yml', 'Gemfile.lock') }}
      - name: Refresh cached WebP timestamps
        if: steps.responsive-webp-cache.outputs.cache-hit == 'true'
        run: find _site/assets/img -type f -name '*.webp' -exec touch {} +
      - name: Set the discussion repository
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Build the site
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Remove unused CSS
        run: npm run purgecss
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
